<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thrulala</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #0a1128; /* Deep Navy */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(214, 43, 30, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.15) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            max-width: 650px;
            width: 100%;
            padding: 20px;
            z-index: 2;
        }
        h1 {
            color: #d4af37; /* Gold */
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 2px 2px 0px #d62b1e;
        }
        .subtitle {
            color: #8a99b8;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .post-card {
            background: rgba(16, 24, 48, 0.8);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 35px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.1);
            position: relative;
            min-height: 200px;
            backdrop-filter: blur(10px);
        }
        .post-card::before {
            content: "THRULALA";
            position: absolute;
            top: -12px;
            left: 20px;
            background: #0a1128;
            padding: 0 10px;
            font-weight: bold;
            color: #d4af37;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
        .post-text {
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1.6;
            color: #fff;
        }
        .generate-btn {
            background: linear-gradient(180deg, #e62b1e 0%, #b32018 100%);
            color: white;
            border: 2px solid #d4af37;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 6px 0 #800f0a, 0 10px 20px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        .generate-btn:hover {
            box-shadow: 0 6px 0 #800f0a, 0 10px 25px rgba(214, 43, 30, 0.5);
        }
        .generate-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #800f0a, 0 5px 15px rgba(0,0,0,0.3);
        }
        .tags {
            margin-top: 20px;
            color: #d4af37;
            font-weight: bold;
            font-size: 1.1rem;
        }
        /* Анимация появления */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate {
            animation: fadeInScale 0.4s ease-out forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>thrulala</h1>
    <div class="subtitle">Генератор абсолютной правды</div>
    
    <div class="post-card">
        <div id="post-text" class="post-text">
            Нажмите кнопку, чтобы создать величайшее заявление в истории!
        </div>
        <div id="tags" class="tags">#Truth #AmericaFirst</div>
    </div>

    <button id="generate-btn" class="generate-btn">Сгенерировать</button>
</div>

<script src="script.js"></script>
</body>
</html>
