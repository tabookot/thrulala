<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thrulala</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #060b14;
            color: #e7e9ea;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            border-left: 1px solid #1a2030;
            border-right: 1px solid #1a2030;
            min-height: 100vh;
            position: relative;
            background: #060b14;
        }
        .header {
            position: sticky;
            top: 0;
            background: rgba(6, 11, 20, 0.92);
            backdrop-filter: blur(12px);
            z-index: 50;
            border-bottom: 1px solid #1a2030;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
            flex-shrink: 0;
        }
        .header-text h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #d4af37;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-text .motto {
            font-size: 0.75rem;
            color: #5a6070;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .compose-box {
            border-bottom: 1px solid #1a2030;
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
            flex-shrink: 0;
        }
        .compose-right { flex: 1; }
        .compose-placeholder {
            color: #5a6070;
            font-size: 1.15rem;
            margin-bottom: 12px;
            padding-top: 6px;
        }
        .compose-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-row { display: flex; gap: 10px; }
        .thru-btn {
            background: linear-gradient(180deg, #e62b1e 0%, #b32018 100%);
            color: white;
            border: 2px solid #d4af37;
            padding: 8px 24px;
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 #800f0a;
            letter-spacing: 0.5px;
        }
        .thru-btn:hover {
            box-shadow: 0 3px 0 #800f0a, 0 4px 12px rgba(214, 43, 30, 0.4);
        }
        .thru-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #800f0a;
        }
        .nuke-btn {
            background: transparent;
            color: #f4212e;
            border: 1.5px solid #f4212e;
            padding: 8px 14px;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nuke-btn:hover {
            background: rgba(244,33,46,0.12);
            box-shadow: 0 0 12px rgba(244,33,46,0.25);
        }
        .nuke-btn:active { transform: scale(0.95); }
        .feed { display: flex; flex-direction: column; }
        .post {
            border-bottom: 1px solid #1a2030;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            transition: background 0.15s;
            position: relative;
            animation: slideIn 0.35s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post:hover { background: rgba(255,255,255,0.02); }
        .post-body { flex: 1; min-width: 0; }
        .post-header-line {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .post-name {
            font-weight: 800;
            color: #e7e9ea;
            font-size: 0.95rem;
        }
        .verified {
            color: #d4af37;
            font-size: 0.9rem;
            line-height: 1;
        }
        .post-handle { color: #5a6070; font-size: 0.9rem; }
        .post-dot { color: #5a6070; font-size: 0.8rem; }
        .post-time { color: #5a6070; font-size: 0.85rem; }
        .post-text {
            font-size: 1.05rem;
            line-height: 1.45;
            color: #e7e9ea;
            margin-bottom: 6px;
            word-wrap: break-word;
        }
        .post-tags {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .post-tags a {
            color: #1d9bf0;
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.15s;
        }
        .post-tags a:hover { color: #d4af37; text-decoration: underline; }
        .reactions {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .react-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: #5a6070;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.15s;
            position: relative;
            font-weight: 600;
            min-width: 28px;
        }
        .react-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.2s;
        }
        .react-btn:hover { background: rgba(255,255,255,0.05); }
        .react-btn:hover svg { transform: scale(1.15); }
        .react-btn.like:hover, .react-btn.like.liked { color: #f91880; }
        .react-btn.like.liked:hover { background: rgba(249,24,128,0.1); }
        .react-btn.fire:hover, .react-btn.fire.liked { color: #ff7a00; }
        .react-btn.fire.liked:hover { background: rgba(255,122,0,0.1); }
        .react-btn.laugh:hover, .react-btn.laugh.liked { color: #ffad1f; }
        .react-btn.laugh.liked:hover { background: rgba(255,173,31,0.1); }
        .react-btn.poop:hover, .react-btn.poop.liked { color: #8B4513; }
        .react-btn.poop.liked:hover { background: rgba(139,69,19,0.1); }
        .react-btn.skull:hover, .react-btn.skull.liked { color: #e7e9ea; }
        .react-btn.skull.liked:hover { background: rgba(255,255,255,0.1); }
        .react-btn.dislike:hover, .react-btn.dislike.liked { color: #1d9bf0; }
        .react-btn.dislike.liked:hover { background: rgba(29,155,240,0.1); }
        .react-btn .count {
            min-width: 8px;
            text-align: left;
            display: inline-block;
        }
        .react-btn .count.hidden { display: none; }
        .react-btn .count.appear {
            animation: countAppear 0.4s ease-out;
        }
        @keyframes countAppear {
            0% { opacity: 0; transform: scale(0) translateY(6px); }
            60% { transform: scale(1.2) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #5a6070;
            font-size: 1.1rem;
            border-bottom: 1px solid #1a2030;
        }

        /* NUKE */
        .nuke-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060b14;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .nuke-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .nuke-red {
            position: absolute;
            inset: 0;
            background: #e62b1e;
            opacity: 0;
            animation: nukeRedPulse 2.5s ease-in-out forwards;
        }
        @keyframes nukeRedPulse {
            0% { opacity: 0; }
            20% { opacity: 0.9; }
            40% { opacity: 0.3; }
            60% { opacity: 1; }
            80% { opacity: 0.2; }
            100% { opacity: 0; }
        }
        .nuke-flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            animation: nukeFlashWhite 2.5s ease-out forwards;
        }
        @keyframes nukeFlashWhite {
            0% { opacity: 0; }
            55% { opacity: 0; }
            65% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        .nuke-text {
            position: relative;
            z-index: 10;
            font-size: 4.5rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 20px #d4af37, 0 0 40px #e62b1e;
            opacity: 0;
            animation: nukeTextShow 2.5s ease-out forwards;
        }
        @keyframes nukeTextShow {
            0% { opacity: 0; transform: scale(0.3); }
            15% { opacity: 1; transform: scale(1.3); }
            30% { transform: scale(1); }
            70% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(2); }
        }
        .post-shake {
            animation: shakePost 0.15s ease-in-out infinite;
        }
        @keyframes shakePost {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, 2px); }
        }
        .post-burn {
            animation: burnAway 0.6s ease-in forwards;
        }
        @keyframes burnAway {
            0% { opacity: 1; transform: scale(1); filter: brightness(1); }
            30% { opacity: 0.7; transform: scale(1.01) rotate(0.5deg); filter: brightness(3) sepia(1) hue-rotate(-20deg) saturate(4); }
            70% { opacity: 0.2; transform: scale(0.9) rotate(-1deg); filter: brightness(5) sepia(1) hue-rotate(-40deg) saturate(6); }
            100% { opacity: 0; transform: scale(0.5); filter: brightness(8) sepia(1); }
        }

        .bot-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 15, 25, 0.95);
            border: 1px solid #1a2030;
            color: #d4af37;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            will-change: transform, opacity;
        }
        .bot-toast.show { opacity: 1; transform: translateY(0); }
    </style>
